name: Container and Compose

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install ".[dev]"
      - name: Validate application
        run: |
          ruff check src tests
          mypy src
          pytest
      - name: Validate Compose deployment
        run: docker compose config --quiet
      - name: Build image
        run: docker build -t cti-automator:ci .
      - name: Smoke test real OpenCTI adapter and MCP runtime
        run: |
          docker run --rm -d --name cti-runtime-ci --read-only --tmpfs /tmp:rw,size=134217728 --cap-drop ALL --security-opt no-new-privileges -v "$PWD/tests/runtime_smoke.py:/opt/runtime_smoke.py:ro" cti-automator:ci
          trap 'docker stop cti-runtime-ci' EXIT
          docker exec cti-runtime-ci python /opt/runtime_smoke.py
          docker exec cti-runtime-ci python - <<'PY'
          import urllib.request
          assert urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=15).status == 200
          metrics = urllib.request.urlopen('http://127.0.0.1:8000/metrics', timeout=15).read()
          assert b'cti_operations_total' in metrics
          PY
          docker exec cti-runtime-ci python - <<'PY'
          import asyncio
          from fastmcp import Client

          async def check():
              async with Client("http://127.0.0.1:8000/mcp") as client:
                  await client.ping()
                  tools = await client.list_tools()
                  assert {tool.name for tool in tools} == {
                      "analyze_pdf", "export_pdf_to_opencti", "export_pdf_to_stix",
                      "get_otx_pulses", "get_threatfox_iocs",
                      "enrich_indicators", "push_to_opencti", "ingest_repositories",
                      "generate_detections", "remember_analysis", "recall_memory",
                      "create_secops_case", "send_chatops_notification",
                  }

          asyncio.run(check())
          PY
          docker stop cti-runtime-ci
          trap - EXIT
      - name: Validate monitoring configuration and alert thresholds
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" -v "$PWD/tests/fixtures/prometheus-rules-test.yml:/tmp/rules-test.yml:ro" prom/prometheus:v3.5.0 test rules /tmp/rules-test.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kta41/cti-automator
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Publish validated image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
