[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cti-automator"
version = "0.2.0"
description = "Privacy-first Cyber Threat Intelligence ingestion and OpenCTI automation agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "CTI Automator Contributors" },
]
keywords = [
    "cybersecurity",
    "cyber-threat-intelligence",
    "cti",
    "opencti",
    "stix",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "fastmcp>=2.0,<3.0",
    "pdfplumber>=0.11,<1.0",
    "pydantic>=2.7,<3.0",
    "pycti>=6.0,<7.0",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
cti-automator = "cti_automator.cli:main"

[project.urls]
Homepage = "https://github.com/kta41/CTI-Automator"
Repository = "https://github.com/kta41/CTI-Automator"
Issues = "https://github.com/kta41/CTI-Automator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cti_automator"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "pdfplumber",
    "pycti",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

