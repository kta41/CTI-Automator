apiVersion: v1
kind: Service
metadata:
  name: cti-automator
  namespace: cti-automator
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
  labels:
    app.kubernetes.io/name: cti-automator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cti-automator
  ports:
    - name: http
      port: 8000
      targetPort: http
