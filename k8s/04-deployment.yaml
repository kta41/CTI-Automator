apiVersion: apps/v1
kind: Deployment
metadata:
  name: cti-automator
  namespace: cti-automator
  labels:
    app.kubernetes.io/name: cti-automator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cti-automator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cti-automator
    spec:
      serviceAccountName: cti-automator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cti-automator
          image: ghcr.io/kta41/cti-automator:latest
          imagePullPolicy: IfNotPresent
          args: ["mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cti-automator-config
            - secretRef:
                name: cti-automator-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /state
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: state
          persistentVolumeClaim:
            claimName: cti-automator-state
