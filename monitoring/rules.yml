groups:
  - name: cti-automator
    rules:
      - alert: CTIMCPUnavailable
        expr: up{job="cti-automator"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: CTI MCP metrics endpoint is unavailable
      - alert: CTIOperationErrors
        expr: sum(rate(cti_operations_total{outcome="error"}[5m])) / clamp_min(sum(rate(cti_operations_total[5m])), 0.001) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 20 percent of CTI operations are failing
      - alert: CTIQuotaExceeded
        expr: sum(increase(cti_quota_errors_total[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: External enrichment quota was exhausted
      - alert: CTISlowOperations
        expr: histogram_quantile(0.95, sum by (le, operation) (rate(cti_operation_seconds_bucket[5m]))) > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CTI operation p95 latency exceeds 120 seconds
