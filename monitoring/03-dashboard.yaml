apiVersion: v1
kind: ConfigMap
metadata:
  name: cti-grafana-dashboard
  namespace: cti-automator
  labels:
    grafana_dashboard: "1"
data:
  cti-automator.json: |
    {
      "uid": "cti-automator",
      "title": "CTI Automator Operations",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "templating": {"list": [{"name": "DS_PROMETHEUS", "type": "datasource", "query": "prometheus"}]},
      "panels": [
        {"id": 1, "title": "Operation rates", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
         "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
         "targets": [{"refId": "A", "expr": "sum by (operation, outcome) (rate(cti_operations_total[5m]))", "legendFormat": "{{operation}} {{outcome}}"}]},
        {"id": 2, "title": "p95 latency (seconds)", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
         "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
         "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le, operation) (rate(cti_operation_seconds_bucket[5m])))", "legendFormat": "{{operation}}"}]},
        {"id": 3, "title": "Processed items", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
         "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
         "targets": [{"refId": "A", "expr": "sum by (operation) (rate(cti_items_total[5m]))", "legendFormat": "{{operation}}"}]},
        {"id": 4, "title": "Quota failures", "type": "timeseries", "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
         "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
         "targets": [{"refId": "A", "expr": "sum by (operation) (increase(cti_quota_errors_total[5m]))", "legendFormat": "{{operation}}"}]}
      ]
    }
