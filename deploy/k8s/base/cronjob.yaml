apiVersion: batch/v1
kind: CronJob
metadata:
  name: cti-automator-ingest
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: cti-automator
          containers:
            - name: ingest
              image: ghcr.io/kta41/cti-automator:latest
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  cti-automator ingest-otx &&
                  cti-automator ingest-threatfox
              envFrom:
                - configMapRef:
                    name: cti-automator-config
                - secretRef:
                    name: cti-automator-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
